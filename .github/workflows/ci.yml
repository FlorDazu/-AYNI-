name: CI

on:
  push:
    branches: [main, master, frontend]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar driver ODBC de SQL Server (pyodbc necesita unixODBC)
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Instalar dependencias
        run: uv sync

      - name: Verificar que la API carga
        run: uv run python -c "from app.main import app; print('OK')"

      - name: Ejecutar pruebas
        run: uv run pytest

  frontend:
    name: Frontend (ng build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build
